<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manufacturing DB · Phone complaints</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="dev">
<header id="top"></header>
<div id="msg" role="status"></div>
<main>
  <h2>Manufacturing DB</h2>
  <form id="f-dev" class="grid">
    <label>IMEI
      <span style="display:flex;gap:.5rem">
        <input name="imei" id="dev-imei" required maxlength="15" style="flex:1">
        <button type="button" id="gen-imei" class="act alt">Generate</button>
      </span>
    </label>
    <label>Serial<input name="serial" required></label>
    <label>Model<input name="model" required></label>
    <label>Sale / activation date<input type="date" name="sale_date" required></label>
    <label>Warranty months<input type="number" name="warranty_months" value="12"></label>
    <label class="chk"><input type="checkbox" name="blacklisted"> Blacklisted or stolen</label>
    <button class="primary">Add device</button>
  </form>
  <table id="dev-tbl"></table>
</main>
<script src="common.js"></script>
<script src="devices.js"></script>
</body></html>
